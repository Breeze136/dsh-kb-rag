<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei','Source Han Sans SC','Noto Sans CJK SC',sans-serif"><style>text.serif,text.serif-title{font-family:'Noto Serif SC','Source Han Serif SC','SimSun','Songti SC',serif;}text.serif-title{font-weight:600;}</style><title>kb-rag：从一段证据，继续追查它的引用</title><desc>示意：证据段落末尾的引用标记 [4, 7] 分别指向库内文献与库外文献，主题相似的相关文献单独列出，不表示引用关系。</desc><defs><filter id="cardShadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#191C1E" flood-opacity="0.08"/></filter></defs><rect width="1600" height="900" fill="#FBF9F4"/><g id="title"><rect x="80" y="72" width="54" height="5" rx="2.5" fill="#1F5FA8"/><text x="80" y="152" font-size="56" fill="#191C1E" font-weight="700" letter-spacing="-0.5" class="serif-title">Precise citation linking — no evidence missed.</text><text x="80" y="204" font-size="24" fill="#3B4144" font-weight="400" class="serif">From one passage, follow its citations.</text></g><g id="evidence"><text x="84" y="304" font-size="20" fill="#9AA0A4" font-weight="500" letter-spacing="3">PASSAGE  ·  PAPER A</text><rect x="80" y="320" width="660" height="360" rx="14" fill="#FFFFFF" stroke="#E4DFD3" stroke-width="1.5" filter="url(#cardShadow)"/><text x="116" y="376" font-size="24" fill="#191C1E" font-weight="600" letter-spacing="-0.2" class="serif">Graphene nucleation on copper:</text><text x="116" y="410" font-size="24" fill="#191C1E" font-weight="600" letter-spacing="-0.2" class="serif">the role of surface treatment</text><text x="116" y="448" font-size="19" fill="#6B7074" font-weight="400">Paper A  ·  Results  ·  PDF p.4</text><line x1="116" y1="472" x2="704" y2="472" stroke="#EDE8DC" stroke-width="1.5"/><text x="116" y="556" font-size="24" fill="#2B2F31" font-weight="400" class="serif">Nucleation is dominated by grain</text><text x="116" y="596" font-size="24" fill="#2B2F31" font-weight="400" class="serif">boundaries and surface defects</text><rect x="494" y="580" width="78" height="32" rx="7" fill="#E8F0FA"/><text x="505.5" y="603" font-size="24" fill="#1F5FA8" font-weight="600">[4, 7]</text></g><g id="refs"><text x="844" y="304" font-size="20" fill="#9AA0A4" font-weight="500" letter-spacing="3">CITED IN THIS PASSAGE</text><rect x="840" y="320" width="680" height="170" rx="14" fill="#FFFFFF" stroke="#E4DFD3" stroke-width="1.5" filter="url(#cardShadow)"/><text x="876" y="356" font-size="17" fill="#1F5FA8" font-weight="600" letter-spacing="2">REF 4</text><rect x="1358" y="334" width="136" height="36" rx="8" fill="#E8F0FA"/><text x="1426" y="358" font-size="16.0" fill="#1F5FA8" font-weight="600" letter-spacing="0.5" text-anchor="middle">IN LIBRARY</text><text x="876" y="402" font-size="24" fill="#191C1E" font-weight="600" class="serif">Graphene growth on copper</text><text x="876" y="436" font-size="19" fill="#6B7074" font-weight="400">Carbon  ·  2024</text><text x="1492" y="436" font-size="19" fill="#6B7074" font-weight="400" text-anchor="end">PDF p.7</text><text x="876" y="468" font-size="16" fill="#1F5FA8" font-weight="400">Searchable</text><rect x="840" y="514" width="680" height="166" rx="14" fill="none" stroke="#DAC9A9" stroke-width="1.5" stroke-dasharray="8 6"/><text x="876" y="550" font-size="17" fill="#9AA0A4" font-weight="600" letter-spacing="2">REF 7</text><rect x="1344" y="528" width="150" height="36" rx="8" fill="#F7F0E4"/><text x="1419" y="552" font-size="16.0" fill="#8A6A33" font-weight="600" letter-spacing="0.5" text-anchor="middle">NOT IN LIBRARY</text><text x="876" y="596" font-size="24" fill="#6B7074" font-weight="400" class="serif">Copper surface preparation for CVD</text><text x="876" y="630" font-size="19" fill="#B4B7B2" font-weight="400">Reference entry  ·  no PDF in library</text><text x="876" y="662" font-size="16" fill="#8A6A33" font-weight="400">Refill lead</text></g><g id="links"><path d="M 572 596 H 790 V 404 H 830" fill="none" stroke="#1F5FA8" stroke-width="2" stroke-linejoin="round"/><path d="M 830 399 L 841 404 L 830 409 Z" fill="#1F5FA8"/><path d="M 790 596 H 830" fill="none" stroke="#8A6A33" stroke-width="2" stroke-linejoin="round"/><path d="M 830 591 L 841 596 L 830 601 Z" fill="#8A6A33"/></g><g id="related"><line x1="80" y1="716" x2="1520" y2="716" stroke="#DFD8C9" stroke-width="1.5"/><text x="80" y="766" font-size="17" fill="#6B7074" font-weight="400">Related work  ·  Raman characterization of graphene</text><text x="1520" y="765" font-size="19" fill="#6B7074" font-weight="400" text-anchor="end">Topically similar  ·  not a citation</text></g></svg>