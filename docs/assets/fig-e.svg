<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Segoe UI','Microsoft YaHei UI','Microsoft YaHei','Source Han Sans SC','Noto Sans CJK SC',sans-serif"><style>text.serif,text.serif-title{font-family:'Noto Serif SC','Source Han Serif SC','SimSun','Songti SC',serif;}text.serif-title{font-weight:600;}</style><title>kb-rag：一圈一圈补，答案越来越全</title><desc>示意：证据段落引用 [4] 与 [7]；[7] 本轮补进库后能打开到 PDF p.9，这篇论文自己的参考文献里又分出库内与库外条目，新的库外线索回到同一个问题。演示数据为合成占位。</desc><defs><filter id="cardShadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#191C1E" flood-opacity="0.08"/></filter></defs><rect width="1600" height="900" fill="#FBF9F4"/><g id="title"><rect x="80" y="72" width="54" height="5" rx="2.5" fill="#1F5FA8"/><text x="80" y="152" font-size="56" fill="#191C1E" font-weight="700" letter-spacing="-0.5" class="serif-title">循环补库，陌生领域越查越全。</text><text x="80" y="204" font-size="24" fill="#3B4144" font-weight="400" class="serif">每一轮补进来的文献，都会把参考文献里的引文带进下一轮检索。</text></g><g id="evidence"><text x="84" y="304" font-size="20" fill="#9AA0A4" font-weight="500" letter-spacing="3">证据段落  ·  论文 A</text><rect x="80" y="320" width="680" height="300" rx="14" fill="#FFFFFF" stroke="#E4DFD3" stroke-width="1.5" filter="url(#cardShadow)"/><text x="116" y="376" font-size="24" fill="#191C1E" font-weight="600" letter-spacing="-0.2" class="serif">Graphene nucleation on copper:</text><text x="116" y="410" font-size="24" fill="#191C1E" font-weight="600" letter-spacing="-0.2" class="serif">the role of surface treatment</text><text x="116" y="448" font-size="19" fill="#6B7074" font-weight="400">Paper A  ·  Results  ·  PDF p.4</text><line x1="116" y1="472" x2="724" y2="472" stroke="#EDE8DC" stroke-width="1.5"/><text x="116" y="552" font-size="24" fill="#2B2F31" font-weight="400" class="serif">Nucleation is dominated by grain</text><text x="116" y="592" font-size="24" fill="#2B2F31" font-weight="400" class="serif">boundaries and surface defects</text><rect x="494" y="566" width="78" height="32" rx="7" fill="#E8F0FA"/><text x="505.5" y="589" font-size="24" fill="#1F5FA8" font-weight="600">[4, 7]</text></g><g id="ref7"><text x="804" y="304" font-size="20" fill="#9AA0A4" font-weight="500" letter-spacing="3">本轮补进库  ·  原为库外条目</text><rect x="800" y="320" width="720" height="132" rx="14" fill="#FFFFFF" stroke="#E4DFD3" stroke-width="1.5" filter="url(#cardShadow)"/><text x="836" y="352" font-size="17" fill="#1F5FA8" font-weight="600" letter-spacing="2">REF 7</text><rect x="1392" y="330" width="96" height="34" rx="8" fill="#E8F0FA"/><text x="1440" y="354" font-size="16" fill="#1F5FA8" font-weight="600" text-anchor="middle">库内</text><text x="836" y="396" font-size="24" fill="#191C1E" font-weight="600" class="serif">Copper surface preparation for CVD</text><text x="836" y="432" font-size="17" fill="#6B7074" font-weight="400">Carbon  ·  2024</text><text x="1484" y="432" font-size="17" fill="#6B7074" font-weight="400" text-anchor="end">PDF p.9</text></g><g id="refs"><text x="804" y="492" font-size="20" fill="#9AA0A4" font-weight="500" letter-spacing="3">参考文献的引文</text><rect x="800" y="508" width="720" height="88" rx="14" fill="#FFFFFF" stroke="#E4DFD3" stroke-width="1.5"/><text x="836" y="544" font-size="16" fill="#1F5FA8" font-weight="600" letter-spacing="2">REF 2</text><rect x="1392" y="536" width="96" height="32" rx="8" fill="#E8F0FA"/><text x="1440" y="558" font-size="16" fill="#1F5FA8" font-weight="600" text-anchor="middle">库内</text><text x="908" y="552" font-size="24" fill="#191C1E" font-weight="400" class="serif">Copper foil annealing for graphene</text><text x="908" y="580" font-size="16" fill="#9AA0A4" font-weight="400">PDF p.6</text><rect x="800" y="604" width="720" height="88" rx="14" fill="none" stroke="#DAC9A9" stroke-width="1.5" stroke-dasharray="8 6"/><text x="836" y="640" font-size="17" fill="#9AA0A4" font-weight="600" letter-spacing="2">REF 9</text><rect x="1392" y="632" widt